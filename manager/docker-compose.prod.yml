# Deploy server (home-lab Ubuntu sau NAT). Trên server:
#   docker login ghcr.io                      # 1 lần (PAT có read:packages)
#   cp .env.prod.example .env  && sửa .env     # POSTGRES_PASSWORD + CF_TUNNEL_TOKEN
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# - backend: kéo image GHCR (đã bake model -> chạy ngay), tự embed query + dense retrieve
# - db: pgvector. PHẢI nạp INDEX trước (pg_dump documents+chunks từ Mac -> restore)
# - cloudflared: Cloudflare Tunnel -> public HTTPS hostname, KHÔNG mở port/router.
#   Ingress (hostname -> http://backend:8000) cấu hình ở Cloudflare Zero Trust dashboard.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    shm_size: "3gb"
    environment:
      POSTGRES_DB: legal
      POSTGRES_USER: legal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legal}
    volumes:
      - legal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal -d legal"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ghcr.io/alice-creator/legal-agent-backend:latest
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"   # watchtower auto-update CHỈ container này
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_DSN: postgresql://legal:${POSTGRES_PASSWORD:-legal}@db:5432/legal
    ports:
      - "8000:8000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    depends_on:
      - backend
    # chỉ kết nối RA Cloudflare (outbound), không cần mở port nào.

  # Auto-deploy: poll GHCR, thấy image backend :latest mới (CI vừa push) -> tự pull
  # + recreate backend. Pull-based -> hợp home-lab sau NAT (CI khỏi SSH vào server).
  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.docker/config.json:/config.json:ro   # creds GHCR (sau `docker login ghcr.io`)
    environment:
      DOCKER_CONFIG: /
      WATCHTOWER_LABEL_ENABLE: "true"        # chỉ update container có label (backend)
      WATCHTOWER_CLEANUP: "true"             # xoá image cũ sau khi update
      WATCHTOWER_POLL_INTERVAL: "120"        # poll GHCR mỗi 120s

volumes:
  legal_pgdata:
